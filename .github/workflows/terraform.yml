name: AWS OIDC S3 List

on:
  push:
    branches: [main]

permissions:
  id-token: write   # Required for OIDC
  contents: read    # Required for checkout

jobs:
  list-s3-buckets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4   # latest stable

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4   # stable release
        with:
          role-to-assume: arn:aws:iam::712607540805:role/oidc-github-role #${{ secrets.AWS_IAM_ROLE }}    # full ARN stored in GitHub Secrets
          role-session-name: github-oidc-session
          aws-region: us-east-1

      - name: List S3 buckets
        run: aws s3 ls
